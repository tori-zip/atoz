<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="오늘의 운명곡">
  <meta name="theme-color" content="#FDF3C7">
  <title>오늘의 에이티즈(ATEEZ) 운명곡</title>
  <!-- Tailwind CSS 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            hippie: ['"Hippie"', 'cursive', 'sans-serif'],
          },
          colors: {
            pirate: {
              cream: '#FDF3C7',
              card: '#FFFDF7',
              brown: '#5A3E2B',
              lightBrown: '#8C674E',
              yellow: '#FFE885',
              gold: '#FFCA3A',
              coral: '#E86A58',
              coralDark: '#D15240',
              sky: '#D6EFFF',
              skyDark: '#B8E1FC',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 눈누 히피체 웹폰트 등록 */
    @font-face {
      font-family: 'Hippie';
      src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2610081905@hippie/hippie/hippie_히피체.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    /* 사이트 전체 폰트를 'Hippie'로 통일 & 모바일 터치 최적화 */
    *, html, body, button, input, select, textarea {
      font-family: 'Hippie', cursive, sans-serif !important;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100dvh;
      background-color: #FDF3C7;
      color: #5A3E2B;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      padding-top: max(1.25rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    button, a {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 동화책 느낌의 둥근 카드 테두리와 입체 그림자 */
    .comic-box {
      border: 3px solid #5A3E2B;
      box-shadow: 5px 5px 0px #5A3E2B;
      border-radius: 26px;
    }

    .comic-box-sm {
      border: 2.5px solid #5A3E2B;
      box-shadow: 3px 3px 0px #5A3E2B;
      border-radius: 18px;
    }

    .comic-btn {
      border: 3px solid #5A3E2B;
      box-shadow: 4px 4px 0px #5A3E2B;
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, background-color 0.15s ease;
    }

    @media (hover: hover) {
      .comic-btn:hover {
        transform: translate(-1px, -1px);
        box-shadow: 5px 5px 0px #5A3E2B;
      }
    }

    .comic-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #5A3E2B;
    }

    /* 아래쪽 해적 병아리를 가리키는 말풍선 */
    .speech-bubble-top {
      position: relative;
      background: #FFFDF7;
      border: 3px solid #5A3E2B;
      box-shadow: 4px 4px 0px #5A3E2B;
      border-radius: 22px;
    }
    .speech-bubble-top::before {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 16px 12px 0 12px;
      border-style: solid;
      border-color: #5A3E2B transparent transparent transparent;
    }
    .speech-bubble-top::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 13px 9px 0 9px;
      border-style: solid;
      border-color: #FFFDF7 transparent transparent transparent;
    }
  </style>
</head>
<body class="flex flex-col justify-between sm:py-10">

  <!-- 상단 타이틀 영역 -->
  <header class="w-full max-w-xl mx-auto text-center mb-2 sm:mb-3">
    <h1 class="text-3xl sm:text-5xl font-bold text-pirate-brown tracking-tight">
      오늘의 운명곡
    </h1>
    <p class="text-lg sm:text-2xl font-bold text-pirate-lightBrown mt-0.5">
      에이티즈(ATEEZ) 전곡 랜덤 추천이에요!
    </p>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="w-full max-w-xl mx-auto flex-1 flex flex-col items-center justify-center">

    <!-- 1. 해적 병아리 & 말풍선 영역 -->
    <section class="w-full flex flex-col items-center mb-2">
      <!-- 말풍선 -->
      <div class="speech-bubble-top px-4 py-3 sm:px-6 sm:py-3.5 max-w-md w-full text-center mb-3 sm:mb-4">
        <p id="chickSpeechText" class="text-lg sm:text-2xl font-bold text-pirate-brown leading-snug break-keep">
          오늘 에이티니에게 딱 맞는 운명의 노래를 골라왔어요!
        </p>
      </div>

      <!-- 해적 병아리 캐릭터 버튼 -->
      <button type="button"
              id="pirateChickBtn"
              onclick="onChickClick()"
              title="해적 병아리를 눌러보세요!"
              class="w-36 h-36 sm:w-52 sm:h-52 flex items-center justify-center cursor-pointer focus:outline-none select-none bg-transparent border-0 p-0 active:scale-95 transition-transform">
        <img id="pirateChickImg"
             src="KakaoTalk_20261122_161126025-removebg-preview.jpg"
             alt="해적 병아리 마스코트"
             onerror="handleChickImageError(this)"
             class="w-full h-full object-contain pointer-events-none" />
      </button>
    </section>

    <!-- 2. 오늘의 운명곡 카드 -->
    <article class="w-full bg-pirate-card comic-box p-5 sm:p-8 relative">
      <!-- 모서리 별 장식 -->
      <span class="absolute top-3 left-3.5 sm:top-3.5 sm:left-4 text-pirate-gold text-lg sm:text-xl select-none">✦</span>
      <span class="absolute top-3 right-3.5 sm:top-3.5 sm:right-4 text-pirate-gold text-lg sm:text-xl select-none">✦</span>

      <!-- 오늘 날짜 & 오늘의 운명곡 뱃지 -->
      <div class="flex flex-wrap items-center justify-center gap-2 mb-2.5 sm:mb-3">
        <span id="todayDestinyBadge" class="px-3.5 py-0.5 rounded-full bg-pirate-yellow border-2 border-pirate-brown text-base sm:text-xl font-bold text-pirate-brown">
          오늘의 운명곡
        </span>
      </div>

      <!-- 앨범 / 활동기 뱃지 -->
      <div class="text-center mb-2">
        <span id="songAlbumBadge" class="inline-block max-w-full px-3 py-0.5 rounded-full bg-pirate-sky border-2 border-pirate-brown text-sm sm:text-lg font-bold text-pirate-brown break-keep">
          💿 THE WORLD EP.2 : OUTLAW
        </span>
      </div>

      <!-- 노래 제목 -->
      <div class="text-center my-2.5 sm:my-3 px-1">
        <h2 id="songTitleDisplay" class="text-3xl sm:text-5xl font-bold text-pirate-brown leading-tight break-keep">
          BOUNCY (K-HOT CHILLI PEPPERS)
        </h2>
      </div>

      <!-- 킬링파트 가사 한 줄 박스 -->
      <div class="mt-6 mb-5 sm:mt-7 sm:mb-6 bg-[#FFF7D6] comic-box-sm p-4 sm:p-6 text-center relative">
        <div class="inline-flex items-center gap-1.5 px-3.5 py-0.5 rounded-full bg-pirate-coral text-white font-bold text-sm sm:text-lg border-2 border-pirate-brown -mt-8 sm:-mt-9 mb-1.5 sm:mb-2 shadow-sm">
          <span>💖 킬링파트 가사 한 줄</span>
        </div>

        <blockquote id="killingPartLyric" class="text-xl sm:text-3xl font-bold text-pirate-brown leading-relaxed break-keep my-1">
          “지금부터 Fly, 좀 다른 Spicy, 청양고추 Vibe!”
        </blockquote>
      </div>

      <!-- 다른 곡 랜덤 추천 버튼 -->
      <div class="mb-2.5 sm:mb-3">
        <button type="button"
                onclick="recommendRandomSong()"
                class="w-full min-h-[52px] comic-btn py-3 px-4 rounded-2xl bg-pirate-sky hover:bg-pirate-skyDark text-pirate-brown font-bold text-lg sm:text-xl flex items-center justify-center gap-2 cursor-pointer">
          <span>🎲 다른 곡 새로 추천받기</span>
        </button>
      </div>

      <!-- 하단 액션 버튼 (복사하기 & 유튜브 듣기) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
        <button type="button"
                onclick="copyRecommendation()"
                class="min-h-[52px] comic-btn py-3 px-4 rounded-2xl bg-pirate-yellow hover:bg-pirate-gold text-pirate-brown font-bold text-lg sm:text-xl flex items-center justify-center gap-2 cursor-pointer">
          <span>📋 제목 & 가사 복사하기</span>
        </button>

        <a id="youtubeLinkBtn" href="#" target="_blank" rel="noopener noreferrer"
           class="min-h-[52px] comic-btn py-3 px-4 rounded-2xl bg-pirate-coral hover:bg-pirate-coralDark text-white font-bold text-lg sm:text-xl flex items-center justify-center gap-2">
          <span>▶ 유튜브에서 듣기</span>
        </a>
      </div>
    </article>

  </main>

  <!-- 푸터 -->
  <footer class="w-full max-w-xl mx-auto text-center mt-5 sm:mt-6 pt-2 text-base sm:text-lg font-bold text-pirate-lightBrown break-keep px-2">

  </footer>

      <span id="cuteToastText">제목과 킬링파트 가사를 복사했어요!</span>

  </div>

    const CHICK_CLICK_MESSAGES = [
      "8 MAKES 1 TEAM 🏴‍☠️ ",
      "오늘도 열심히 갑판 닦으러...⭐",
      "우리 배는 언제나 편도로만 가 - ⚓",
      "언제나 너는 말하지 않아도 항상 빛나고 있어 💛",
      "고래가 날면?? 난다용- 🐳 "
    ];

    let currentDestinySong = null;
    let chickMsgIndex = 0;

    function handleChickImageError(img) {
      if (!img.dataset.triedPng) {
        img.dataset.triedPng = "true";
        img.src = "KakaoTalk_20261122_161126025-removebg-preview.png";
      } else if (!img.dataset.retried) {
        img.dataset.retried = "true";
        img.src = "KakaoTalk_20261122_161126025-removebg-preview.jpg?t=" + Date.now();
      } else {
        img.style.display = "none";
      }
    }

    function onChickClick() {
      const speech = document.getElementById('chickSpeechText');
      speech.textContent = CHICK_CLICK_MESSAGES[chickMsgIndex % CHICK_CLICK_MESSAGES.length];
      chickMsgIndex++;
    }

    function getTodayInfo() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return {
        seedStr: `${y}-${m}-${d}`,
        displayStr: `${y}년 ${Number(m)}월 ${Number(d)}일`
      };
    }

    function hashDateSeed(str) {
      let hash = 2166136261;
      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return Math.abs(hash);
    }

    function applySongToUI(song, isRandom = false) {
      currentDestinySong = song;
      const dateInfo = getTodayInfo();

      const badge = document.getElementById('todayDestinyBadge');
      badge.textContent = isRandom ? `🎲 추가 추천 운명곡` : `${dateInfo.displayStr} 오늘의 운명곡`;

      document.getElementById('chickSpeechText').textContent = song.speech;
      document.getElementById('songAlbumBadge').textContent = `💿 ${song.album}`;
      document.getElementById('songTitleDisplay').textContent = song.title;
      document.getElementById('killingPartLyric').textContent = `“${song.lyric}”`;

      const ytQuery = encodeURIComponent(`ATEEZ 에이티즈 ${song.title}`);
      document.getElementById('youtubeLinkBtn').href = `https://www.youtube.com/results?search_query=${ytQuery}`;
    }

    function renderDailyDestinySong() {
      const dateInfo = getTodayInfo();
      const seed = hashDateSeed(dateInfo.seedStr);
      const todaySong = ATEEZ_SONGS[seed % ATEEZ_SONGS.length];

      applySongToUI(todaySong, false);

      document.getElementById('footerTotalCount').textContent =
        `8 MAKES 1 TEAM 🏴‍☠️ 에이티즈 ${ATEEZ_SONGS.length}곡 중 매일매일 새로운 한 곡이 여러분을 찾아갑니다!`;
    }

    function recommendRandomSong() {
      if (ATEEZ_SONGS.length <= 1) return;

      let nextSong;
      do {
        const randomIndex = Math.floor(Math.random() * ATEEZ_SONGS.length);
        nextSong = ATEEZ_SONGS[randomIndex];
      } while (currentDestinySong && nextSong.title === currentDestinySong.title);

      applySongToUI(nextSong, true);
      showCuteToast('새로운 운명곡을 뽑아왔어요! 🎲');
    }

    async function copyRecommendation() {
      if (!currentDestinySong) return;

      const dateInfo = getTodayInfo();
      const textToCopy =
        `🏴‍☠️✨ ${dateInfo.displayStr} 오늘의 에이티즈(ATEEZ) 운명곡\n` +
        `♪ 제목: ${currentDestinySong.title}\n` +
        `💖 킬링파트: "${currentDestinySong.lyric}"\n` +
        `💿 앨범: ${currentDestinySong.album}\n` +
        `#ATEEZ #에이티즈 #ATINY #오늘의운명곡`;

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(textToCopy);
          showCuteToast('제목과 킬링파트 가사를 복사했어요! ✨');
          return;
        } catch (err) {
          // 폴백 방식으로 진행
        }
      }

      const textarea = document.createElement('textarea');
      textarea.value = textToCopy;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, 99999);

      try {
        document.execCommand('copy');
        showCuteToast('제목과 킬링파트 가사를 복사했어요! ✨');
      } catch (e) {
        showCuteToast('복사에 실패했어요! 다시 한 번만 눌러주시겠어요? 💦');
      } finally {
        document.body.removeChild(textarea);
      }
    }

    let toastTimer;
    function showCuteToast(msg) {
      const toast = document.getElementById('cuteToast');
      const toastText = document.getElementById('cuteToastText');
      if (!toast || !toastText) return;

      toastText.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2500);
    }

    window.addEventListener('DOMContentLoaded', renderDailyDestinySong);
  </script>
